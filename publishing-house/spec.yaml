approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: "Observation-based \u2014 participants demonstrate expected\
      \ state in Red Hat cloud extensions UI or CLI output"
    catalog_gap: 'Red Hat cloud extensions is a new platform with no existing
      catalog coverage. All near-matches cover OpenShift Virtualization (KubeVirt)
      operations but none address the Red Hat cloud extensions abstraction layer: tenant lifecycle, native
      VM templates, virtual network and security group configuration, or the Red Hat cloud extensions
      end-user portal experience.'
    design_overview: "A 100-minute intermediate lab for Red Hat cloud extensions admins, platform engineers,\
      \ and cloud architects. Covers the full Red Hat cloud extensions operational workflow: platform health,\
      \ tenant onboarding with federated identity and RBAC, VMaaS catalog publishing and VM deployment,\
      \ and CaaS hosted OpenShift cluster ordering across 4 modules."
    module_summaries:
    - title: Exploring the Red Hat cloud extensions Platform
      overview: Participants verify all Red Hat cloud extensions operators, CSVs, and pods in the `osac` namespace, explore the Red Hat cloud extensions web UI, confirm the Keycloak `osac` realm, and inspect the Kafka cluster, topics, and users.
    - title: Tenant Onboarding and Identity Management
      overview: Participants create the `sai-corp` tenant, verify automatic Keycloak organization and namespace provisioning, configure a corporate identity provider for federated SSO, onboard Alice and Bob through device flow login, assign Alice tenant-admin access, grant Bob project viewer access, and verify RBAC enforcement.
    - title: Virtual Machine as a Service (VMaaS)
      overview: Participants configure storage for tenant workloads, create a Fedora disk image and compute instance type, publish a `ComputeInstanceCatalogItem`, deploy `portal-vm` as tenant administrator Alice, verify it reaches `RUNNING`, and confirm Bob can view but not create or delete VMs.
    - title: Cluster as a Service (CaaS)
      overview: Participants validate Sushy and Metal3 prerequisites, register a libvirt-backed `BareMetalHost`, publish `BareMetalInstanceType`, `DiskImage`, `ClusterVersion`, and `ClusterCatalogItem` objects, order a hosted OpenShift cluster as Alice, apply RHDP `dns.noop` workarounds, and publish the hosted cluster API and console.
    rcars_overlap_pct: 60
    rcars_top_matches:
    - title: Operations and Automation with OpenShift Virtualization
      ci_name: openshift-cnv.virt-aap-day-2.prod
      url: https://catalog.demo.redhat.com/catalog?item=openshift-cnv.virt-aap-day-2.prod
      relevance_score: 60
      why_it_fits: VM lifecycle management and network policy config overlap with
        Red Hat cloud extensions admin workflows, but the lab is Ansible/OCP-Virt focused with no Red Hat cloud extensions-specific
        content.
    - title: 'Experience OpenShift Virtualization: Advanced Operations and Automation'
      ci_name: openshift-cnv.ocp-virt-advanced-ops.prod
      url: https://catalog.demo.redhat.com/catalog?item=openshift-cnv.ocp-virt-advanced-ops.prod
      relevance_score: 55
      why_it_fits: RBAC, networking, and VM lifecycle topics partially overlap, but
        built on KubeVirt not Red Hat cloud extensions.
    - title: 'Experience OpenShift Virtualization: Advanced Operations and Automation
        - Shared RHACM HUB'
      ci_name: openshift-cnv.ocp-virt-advanced-ops-hub.prod
      url: https://catalog.demo.redhat.com/catalog?item=openshift-cnv.ocp-virt-advanced-ops-hub.prod
      relevance_score: 53
      why_it_fits: "Same as above with RHACM multi-cluster added \u2014 still OCP\
        \ Virt, not Red Hat cloud extensions."
    rejections:
    - id: d8fed223-ca79-4364-9ddc-533ec36e900c
      text: RH1 labs are 2 hours, this is only 90 minutes
      resolved: true
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-20T12:22:37.104819+00:00'
    - id: 71416ee3-caa3-42f0-8e36-87ed74f4e777
      text: 'Your description says "Participants take on the role of an OSAC administrator
        to set up and operate the platform". But then you provide them with a fully
        configured environement and your modules are a little on the dry side: create
        a tenant, create a network, creatae a vm. If there is no focus on operating
        the "OSAC Platform", this sounds like VM management 101 with a different UI.'
      resolved: true
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-20T12:22:37.104819+00:00'
