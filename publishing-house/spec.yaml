approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: "Observation-based \u2014 participants demonstrate expected\
      \ state in OSAC UI or CLI output"
    catalog_gap: 'OpenShift Cloud Extensions (OCX) is a new platform with no existing
      catalog coverage. All near-matches cover OpenShift Virtualization (KubeVirt)
      operations but none address the OCX abstraction layer: tenant lifecycle, OCX-native
      VM templates, virtual network and security group configuration, or the OCX
      end-user portal experience.'
    design_overview: "A 2-hour intermediate lab for OCX admins, platform engineers,\
      \ and ops teams. Covers the full OCX operational workflow: tenant administration,\
      \ VM template creation, virtual networking (networks, subnetworks, security\
      \ groups), and VM lifecycle \u2014 with both admin and end-user perspectives\
      \ across 5 modules."
    module_summaries:
    - title: OCX Platform Orientation
      overview: Participants navigate the OCX console, review the platform architecture,
        and verify that both admin and end-user accounts are accessible before beginning
        hands-on tasks.
    - title: Tenant Administration
      overview: Participants create an OCX tenant as an admin, configure quotas and
        settings, assign users to the tenant, and verify the tenant is ready for resource
        provisioning.
    - title: VM Templates
      overview: Participants review available base images, build a VM template with
        compute and image configuration, and publish it to the tenant for use in downstream
        provisioning.
    - title: Virtual Networking
      overview: Participants create a virtual network, add subnetworks, and define
        and attach security groups to establish the network topology that VMs will
        connect to.
    - title: Virtual Machine Lifecycle
      overview: Participants provision a VM using the admin account, perform lifecycle
        operations (start, stop, console access), then switch to the end-user perspective
        to explore how a tenant user requests and accesses a virtual machine.
    rcars_overlap_pct: 60
    rcars_top_matches:
    - title: Operations and Automation with OpenShift Virtualization
      ci_name: openshift-cnv.virt-aap-day-2.prod
      url: https://catalog.demo.redhat.com/catalog?item=openshift-cnv.virt-aap-day-2.prod
      relevance_score: 60
      why_it_fits: VM lifecycle management and network policy config overlap with
        OCX admin workflows, but the lab is Ansible/OCP-Virt focused with no OCX-specific
        content.
    - title: 'Experience OpenShift Virtualization: Advanced Operations and Automation'
      ci_name: openshift-cnv.ocp-virt-advanced-ops.prod
      url: https://catalog.demo.redhat.com/catalog?item=openshift-cnv.ocp-virt-advanced-ops.prod
      relevance_score: 55
      why_it_fits: RBAC, networking, and VM lifecycle topics partially overlap, but
        built on KubeVirt not OCX.
    - title: 'Experience OpenShift Virtualization: Advanced Operations and Automation
        - Shared RHACM HUB'
      ci_name: openshift-cnv.ocp-virt-advanced-ops-hub.prod
      url: https://catalog.demo.redhat.com/catalog?item=openshift-cnv.ocp-virt-advanced-ops-hub.prod
      relevance_score: 53
      why_it_fits: "Same as above with RHACM multi-cluster added \u2014 still OCP\
        \ Virt, not OCX."
    rejections:
    - id: d8fed223-ca79-4364-9ddc-533ec36e900c
      text: RH1 labs are 2 hours, this is only 90 minutes
      resolved: false
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-20T12:22:37.104819+00:00'
    - id: 71416ee3-caa3-42f0-8e36-87ed74f4e777
      text: 'Your description says "Participants take on the role of an OSAC administrator
        to set up and operate the platform". But then you provide them with a fully
        configured environement and your modules are a little on the dry side: create
        a tenant, create a network, creatae a vm. If there is no focus on operating
        the "OSAC Platform", this sounds like VM management 101 with a different UI.'
      resolved: false
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-20T12:22:37.104819+00:00'
  infra:
