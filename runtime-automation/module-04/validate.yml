---
- name: Register bastion in inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add bastion host
      ansible.builtin.add_host:
        name: bastion
        ansible_host: "{{ bastion_public_hostname }}"
        ansible_port: "{{ bastion_ssh_port }}"
        ansible_user: "{{ bastion_ssh_user_name }}"
        ansible_password: "{{ bastion_ssh_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
      no_log: true

- name: Validate module 4 BMF and Metal3 end state
  hosts: bastion
  gather_facts: false
  environment:
    KUBECONFIG: "/home/{{ bastion_ssh_user_name }}/.kube/config"
    CAAS_ORDER_NAME: "{{ caas_order_name | default('') }}"
  tasks:
    - name: Run read-only checks against the current guide topology
      ansible.builtin.command:
        argv: [python3, '-']
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../scripts/validate-caas.py') }}"
      register: caas_validation
      changed_when: false
      failed_when: false

    - name: Report current topology validation evidence
      ansible.builtin.debug:
        msg: "{{ caas_validation.stdout }}"

    - name: Require completed current topology validation
      ansible.builtin.assert:
        that:
          - caas_validation.rc == 0
          - (caas_validation.stdout | from_json).status == 'pass'
        fail_msg: >-
          Module 4 end state is not verified. Retain the deployment and investigate;
          this validator does not provision, repair, retry or delete lab resources.
